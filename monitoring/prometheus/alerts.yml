groups:
  - name: toxicity-service
    rules:
      - alert: ToxicityAPIDown
        expr: up{job="toxicity-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Toxicity API is down"
      - alert: ToxicityHighPredictionErrorRate
        expr: sum(rate(toxicity_http_requests_total{route="/predict",status=~"5.."}[5m])) / clamp_min(sum(rate(toxicity_http_requests_total{route="/predict"}[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prediction error rate above 5%"
      - alert: ToxicityHighPredictionLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(toxicity_inference_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 prediction latency above 1 second"
